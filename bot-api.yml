openapi: 3.0.0
info:
  title: Bot API
  version: 1.0.0
  contact:
    name: Alexander Biryukov
    url: https://github.com
paths:
  /updates:
    post:
      summary: Отправить обновление
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkUpdate'
        required: true
      responses:
        '200':
          description: Обновление обработано
        '400':
          description: Некорректные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  schemas:
    ApiErrorResponse:
      type: object
      required:
        - description
        - code
      properties:
        description:
          type: string
        code:
          type: string
    LinkUpdate:
      type: object
      required:
        - id
        - url
        - description
        - tgChatIds
        - updateAuthor
        - updatedAt
        - title
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        updateAuthor:
          type: string
        updatedAt:
          type: string
        title:
          type: string
        description:
          type: string
        tgChatIds:
          type: array
          items:
            type: integer
            format: int64
